services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: study-server:latest
    container_name: study-server
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      CHIEF_USERNAME: "${CHIEF_USERNAME:-admin}"
      ADMIN_SESSION_TTL: "${ADMIN_SESSION_TTL:-28800}"
      ADMIN_COOKIE_SECURE: "${ADMIN_COOKIE_SECURE:-1}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      GUARD_BASE_URL: "${GUARD_BASE_URL:-https://routerai.ru/api/v1}"
      GUARD_MODEL: "${GUARD_MODEL:-}"
      GUARD_API_KEY: "${GUARD_API_KEY:-}"
      GUARD_TIMEOUT: "${GUARD_TIMEOUT:-30}"
      TARGET_TIMEOUT: "${TARGET_TIMEOUT:-180}"
    volumes:
      - ./COURSE:/app/COURSE:rw
      - study_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port = os.environ.get('PORT', '8000'); urllib.request.urlopen('http://127.0.0.1:' + port + '/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: study-server-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  study_data:
  caddy_data:
  caddy_config:
