<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Обучение — Универсальный сервер</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20261120-roles">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body>
<div class="container">
    <div class="account-bar" id="accountBar">
        <span class="account-user" id="accountUser"></span>
        <button class="account-logout" id="logoutBtn" type="button" title="Выйти">
            <i class="fas fa-sign-out-alt"></i> Выйти
        </button>
    </div>
    <h1><i class="fas fa-graduation-cap"></i> Универсальный обучающий сервер</h1>
    <div class="subtitle" id="subtitle">
        <i class="fas fa-folder-open" style="margin-right:0.5rem;color:var(--secondary);"></i>
        <span id="breadcrumbText">Список курсов</span>
        <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Открыть список курсов">
            <i class="fas fa-list"></i> Курсы
        </button>
        <button class="theme-toggle" id="themeToggle" title="Тёмная тема">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="layout" id="layout">
        <button class="expand-btn" id="expandBtn" title="Развернуть список"><i class="fas fa-chevron-right"></i></button>

        <!-- Левая колонка -->
        <div class="sidebar" id="sidebar">
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Назад к списку</button>
            <div class="sidebar-header">
                <h3 id="sidebarTitle"><i class="fas fa-list"></i> Курсы</h3>
                <button id="collapseBtn" title="Свернуть список"><i class="fas fa-chevron-left"></i></button>
            </div>
            <div id="courseList" class="course-list">
                <div style="padding:1rem; text-align:center; color:#94a3b8;">
                    <i class="fas fa-spinner fa-spin"></i> Загрузка курсов...
                </div>
            </div>
        </div>

        <!-- Правая колонка -->
        <div class="main-content" id="mainContent">
            <div id="viewer">
                <div class="placeholder" id="placeholder">
                    <i class="fas fa-file-alt"></i>
                    <p>Выберите курс из списка слева.</p>
                </div>
                <div class="rendered" id="renderedContent" style="display:none;"></div>
            </div>
            <div class="nav-links">
                <a href="#" class="primary" id="refreshBtn"><i class="fas fa-sync"></i> Обновить список</a>
                <a href="/admin" class="admin" id="adminLink" style="display:none;"><i class="fas fa-lock"></i> Админ</a>
            </div>
        </div>
    </div>
</div>

    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <script src="app.js?v=20261120-roles"></script>
</body>
</html>
